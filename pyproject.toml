[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-guardrail-lab"
version = "0.1.0"
description = "Local, evidence-based security evaluation for an MCP financial agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
guardrail-lab = "guardrail_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
